name: Workflow Pull Request Check

on:
  pull_request:
    branches:
      - main

jobs:
  workflow-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Executar build e testes
        run: |
          mvn clean install