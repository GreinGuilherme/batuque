name: batuque-api-pipeline
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Configurar o QEMU (Necessário para emular outras arquiteturas)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 2. Configurar o Buildx (Motor de build que suporta multi-arch)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login no Docker Hub (já deve existir no seu arquivo)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # 4. Build e Push (Adicione platforms)
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # AQUI ESTÁ O SEGREDO: Compilar para amd64 (PC normal) e arm64 (Oracle VPS)
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/batuque-api:latest
            ${{ secrets.DOCKER_USERNAME }}/batuque-api:${{ github.sha }}

      # Comando opcional para logar na VPS e reiniciar o container automaticamente
      - name: Trigger VPS Update via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 136.248.110.77
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/batuqueapp
            docker compose pull
            docker compose up -d
            docker image prune -f