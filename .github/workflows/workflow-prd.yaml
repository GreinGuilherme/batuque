name: core-api-pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Executar build e testes
        run: |
          mvn clean install

      - name: Auth Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCEKR_TOKEN }}

      - name: build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          taps: |
            ${{ secrets.DOCKER_USERNAME }}/batuque-api:latest
            ${{ secrets.DOCEKR_TOKEN }}/batuque-api:${{ github.sha }}